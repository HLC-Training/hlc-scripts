name: ORION AP Pending Digest

on:
  schedule:
    - cron: '0 12 * * *'    # Daily 12:00 UTC (7:00 AM Houston, CDT)
  workflow_dispatch:            # Manual trigger for testing
    inputs:
      dry_run:
        description: 'Dry run (render only, do not send)'
        required: false
        type: boolean
        default: false
      to:
        description: 'Override recipient email (blank = default recipient)'
        required: false
        type: string

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install supabase requests

      - name: Send digest
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.ORION_SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TO_OVERRIDE: ${{ github.event.inputs.to }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$TO_OVERRIDE" ]; then ARGS+=(--to "$TO_OVERRIDE"); fi
          python send_ap_pending_digest.py "${ARGS[@]}"
