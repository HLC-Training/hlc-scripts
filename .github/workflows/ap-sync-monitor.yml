name: AP Sync Reconciliation Monitor

on:
  workflow_dispatch:            # Triggered by samcos Vercel Cron (fire-ap-sync-monitor, 5,20,35,50); also manual

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install supabase tzdata

      - name: Run monitor
        env:
          SAMCOS_SERVICE_KEY: ${{ secrets.SAMCOS_SERVICE_KEY }}
        run: python ap_sync_monitor.py

      - name: Show monitor log
        if: always()
        run: cat ap_sync_monitor.log
