name: AP Sync Reconciliation Monitor

on:
  schedule:
    - cron: '9,39 * * * *'    # Every 30 minutes, offset from sync-ap.yml's 13,43 and the :00/:30 load spikes
  workflow_dispatch:            # Manual trigger for testing

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install supabase tzdata

      - name: Run monitor
        env:
          SAMCOS_SERVICE_KEY: ${{ secrets.SAMCOS_SERVICE_KEY }}
        run: python ap_sync_monitor.py

      - name: Show monitor log
        if: always()
        run: cat ap_sync_monitor.log
