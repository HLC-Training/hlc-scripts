# Syncs this repo's chat-readable reasoning docs (CLAUDE.md, tasks/lessons.md,
# knowledge/**, docs/architecture*.md) into SAM COS Supabase `repo_docs`.
#
# Identical copy runs in samcos, orion, orion-pll, and hlc-scripts.
# scripts/sync_repo_docs.py is vendored per repo (not a shared reusable
# workflow) because HLC-Training's GitHub plan does not support cross-repo
# workflow_call access ("organization" access level is rejected — only
# "none"/"user" are allowed on this plan). Edits to the sync logic must be
# propagated to all four copies by hand.
#
# workflow_dispatch is the backfill: because every run is a full reconcile,
# a manual dispatch produces the same result a merge would.
name: Sync repo docs to Supabase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install supabase

      - name: Sync
        env:
          SAMCOS_SUPABASE_URL: ${{ secrets.SAMCOS_SUPABASE_URL }}
          SAMCOS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SAMCOS_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_repo_docs.py
