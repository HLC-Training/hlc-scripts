name: ORION AP Sync

on:
  # Actions `schedule:` was contended (per-workflow GitHub Actions scheduler
  # issue, not registration/rate-limit — see samcos
  # knowledge/decisions/2026-08-29-ap-sync-trigger-to-vercel-cron.md). Trigger
  # moved to Vercel Cron (samcos /api/cron/fire-ap-sync, */15 * * * *), which
  # calls workflow_dispatch below. Do not re-add a schedule: trigger without
  # re-reading that decision.
  workflow_dispatch:            # Fired by Vercel Cron; also usable for manual testing
    inputs:
      dry_run:
        description: 'Run with --dry-run (no Supabase writes)'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install smartsheet-python-sdk supabase requests

      - name: Run sync
        env:
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
          ORION_SUPABASE_SERVICE_KEY: ${{ secrets.ORION_SUPABASE_SERVICE_KEY }}
          SAMCOS_SERVICE_KEY: ${{ secrets.SAMCOS_SERVICE_KEY }}
        run: python sync_ap.py ${{ inputs.dry_run == true && '--dry-run' || '' }}

      # The script logs detail (per-row errors, page fetches) to sync_ap.log
      # and prints only the summary line to stdout. Without this step a
      # failed insert is invisible from the Actions UI — the 2026-08-24
      # batch failure had to be reconstructed from Supabase API logs.
      - name: Show sync log
        if: always()
        run: cat sync_ap.log
