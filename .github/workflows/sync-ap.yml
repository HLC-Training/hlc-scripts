name: ORION AP Sync

on:
  schedule:
    - cron: '13,43 * * * *'    # Every 30 minutes, offset to avoid :00/:30 GitHub Actions load spikes
  workflow_dispatch:            # Manual trigger for testing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install smartsheet-python-sdk supabase requests

      # BRANCH-ONLY: --dry-run hard-coded for the 59cd7d7b verification runs.
      # Revert this step to `python sync_ap.py` before merging to main —
      # the live write is a separate go, gated on Jim.
      - name: Run sync (DRY RUN)
        env:
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
          ORION_SUPABASE_SERVICE_KEY: ${{ secrets.ORION_SUPABASE_SERVICE_KEY }}
          SAMCOS_SERVICE_KEY: ${{ secrets.SAMCOS_SERVICE_KEY }}
        run: python sync_ap.py --dry-run

      - name: Show dry-run log
        if: always()
        run: cat sync_ap.log
