name: ORION AP Sync

on:
  # schedule disabled 2026-07-31 for AP pending lifecycle step 2 deploy
  # (migrations + sync + app changes) — Jim approved pausing; the AP
  # tracker tolerates a day without a sync run. Re-enable once step 2 is
  # deployed and verified.
  # schedule:
  #   - cron: '5,35 * * * *'    # Every 30 minutes, offset to avoid :00/:30 GitHub Actions load spikes
  workflow_dispatch:            # Manual trigger for testing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install smartsheet-python-sdk supabase requests

      - name: Run sync
        env:
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.ORION_SUPABASE_SERVICE_KEY }}
          SAMCOS_SERVICE_KEY: ${{ secrets.SAMCOS_SERVICE_KEY }}
        run: python sync_ap.py
